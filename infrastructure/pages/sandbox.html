<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox</title>
    <link rel="stylesheet" type="text/css" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/favicon/sandbox.png">
</head>
<body>
    <h1> Campo de Testes </h1>
    <p> Aqui você pode testar!!! </p>
    <p>Retorne à página anterior clicando aqui: <a href="index.html" rel="prev">Página Anterior</a> </p>

    <main>
        <section id="bloco-audio">
            <h2>Reprodução de Áudio</h2>
            <audio preload="metadata" controls>
                <source src="../assets/audio/background-music.mp3" type="audio/mpeg">
                <p>Seu navegador não suporta áudio <a href="../assets/audio/background-music.mp3" type="audio/mpeg">Baixe o arquivo aqui</a></p>
            </audio>
        </section>

        <section id="bloco-video">
            <h2>Vídeo Incorporado</h2>
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/4Y5DHDR3FYo?si=XaupXkPb8AHsnb-U"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </main>
</body>
</html>
